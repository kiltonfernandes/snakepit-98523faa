name: Deploy Heavynauta Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/plan-rivaldo-treatment/**"
      - "supabase/functions/process-editorial-queue/**"
      - "supabase/functions/upload-episode-to-onedrive/**"
      - "supabase/functions/_shared/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-function.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Supabase deploy credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret to deploy the Edge Function."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Heavynauta functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy process-editorial-queue --project-ref dfzuvcchzcpbnvtjaaca
          supabase functions deploy upload-episode-to-onedrive --project-ref dfzuvcchzcpbnvtjaaca
          supabase functions deploy plan-rivaldo-treatment --project-ref dfzuvcchzcpbnvtjaaca
